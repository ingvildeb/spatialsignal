[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialsignal"
version = "0.1.0"
description = "Spatial point-cloud and mapping toolkit for whole-brain segmented cells"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Christine Mun" },
]
dependencies = [
  "atlaslevels>=0.3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scipy>=1.13",
  "scikit-image>=0.22",
  "tifffile>=2024.2.12",
  "imagecodecs>=2024.1.1",
  "matplotlib>=3.8",
  "natsort>=8.4",
  "nibabel>=5.2",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spatialsignal.config_templates" = ["*.toml"]
