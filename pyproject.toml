[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialsignal"
version = "0.1.0"
description = "Spatial point-cloud and mapping toolkit for whole-brain segmented cells"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Ingvild Bjerke" },
]
keywords = [
  "atlas",
  "image-analysis",
  "light-sheet-microscopy",
  "neuroscience",
  "point-cloud",
  "segmentation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "atlaslevels>=0.3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scipy>=1.13",
  "scikit-image>=0.22",
  "tifffile>=2024.2.12",
  "imagecodecs>=2024.1.1",
  "matplotlib>=3.8",
  "natsort>=8.4",
  "nibabel>=5.2",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/ingvildeb/spatialsignal"
Documentation = "https://github.com/ingvildeb/spatialsignal/tree/main/docs"
Issues = "https://github.com/ingvildeb/spatialsignal/issues"
Repository = "https://github.com/ingvildeb/spatialsignal.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spatialsignal.config_templates" = ["*.toml"]
